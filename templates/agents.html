<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的智能体 - 小智</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); min-height: 100vh; color: #333; }

        .page-header { background: white; border-bottom: 1px solid #e8e8e8; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .page-header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.85rem; color: #666; transition: all 0.2s; text-decoration: none; }
        .back-btn:hover { border-color: #667eea; color: #667eea; background: #f5f3ff; }
        .back-btn svg { width: 16px; height: 16px; }
        .page-title { font-size: 1.3rem; font-weight: 600; color: #1a1a1a; }
        .page-title .subtitle { font-size: 0.85rem; color: #999; font-weight: 400; margin-left: 8px; }

        .page-header-right { display: flex; gap: 12px; align-items: center; }
        .action-btn { padding: 10px 22px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; display: inline-flex; align-items: center; gap: 8px; }
        .action-btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .action-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(102,126,234,0.3); }
        .action-btn-primary svg { width: 16px; height: 16px; fill: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }

        .stats-bar { display: flex; gap: 24px; margin-bottom: 28px; }
        .stat-card { background: white; border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); flex: 1; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .stat-icon.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
        .stat-icon.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-icon.orange { background: linear-gradient(135deg, #f5af19, #f12711); }
        .stat-info .stat-value { font-size: 1.8rem; font-weight: 600; color: #1a1a1a; }
        .stat-info .stat-label { font-size: 0.85rem; color: #999; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toolbar-left { display: flex; gap: 8px; }
        .filter-btn { padding: 8px 16px; border: 1px solid #e0e0e0; border-radius: 20px; background: white; cursor: pointer; font-size: 0.85rem; color: #666; transition: all 0.2s; }
        .filter-btn:hover { border-color: #667eea; color: #667eea; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }

        .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .agent-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); transition: all 0.3s; cursor: pointer; border: 1px solid transparent; position: relative; }
        .agent-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); border-color: rgba(102,126,234,0.2); }
        .agent-card-header { padding: 24px 24px 16px; display: flex; align-items: flex-start; gap: 16px; }
        .agent-card-avatar { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; flex-shrink: 0; box-shadow: 0 4px 12px rgba(102,126,234,0.25); }
        .agent-card-info { flex: 1; min-width: 0; }
        .agent-card-name { font-size: 1.05rem; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .agent-publish-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; font-weight: 500; }
        .agent-draft-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #f0f0f0; color: #666; font-weight: 500; }
        .agent-card-desc { font-size: 0.85rem; color: #888; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .agent-card-meta { padding: 12px 24px; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .agent-card-date { font-size: 0.75rem; color: #bbb; }
        .agent-card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .agent-card:hover .agent-card-actions { opacity: 1; }
        .agent-action-btn { width: 30px; height: 30px; border: none; border-radius: 6px; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #888; transition: all 0.2s; }
        .agent-action-btn:hover { background: #667eea; color: white; }
        .agent-action-btn.danger:hover { background: #ff4757; }
        .agent-action-btn svg { width: 14px; height: 14px; fill: currentColor; }

        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-title { font-size: 1.2rem; color: #666; margin-bottom: 8px; font-weight: 500; }
        .empty-state-desc { color: #999; font-size: 0.9rem; margin-bottom: 24px; }
        .empty-state-btn { padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .empty-state-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(102,126,234,0.3); }

        .confirm-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .confirm-modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
        .confirm-modal { background: white; border-radius: 16px; padding: 28px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.25s; }
        .confirm-modal h3 { margin-bottom: 12px; font-size: 1.1rem; color: #1a1a1a; }
        .confirm-modal p { color: #666; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }
        .confirm-modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .confirm-btn { padding: 8px 20px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.2s; }
        .confirm-btn-cancel { background: #f5f5f5; color: #666; }
        .confirm-btn-cancel:hover { background: #eee; }
        .confirm-btn-danger { background: #ff4757; color: white; }
        .confirm-btn-danger:hover { background: #e8384a; }

        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 28px; border-radius: 10px; font-size: 0.9rem; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: toastIn 0.3s ease; }
        .toast.success { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .toast.error { background: linear-gradient(135deg, #f12711, #f5af19); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="page-header-left">
            <a href="/" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回主页
            </a>
            <h1 class="page-title">🤖 我的智能体 <span class="subtitle">创建专属 AI 助手</span></h1>
        </div>
        <div class="page-header-right">
            <button class="action-btn action-btn-primary" onclick="openCreateModal()">
                <svg viewBox="0 0 24 24"><path d="M15 3h6v6M18 3v18M3 18h18"/></svg>
                创建智能体
            </button>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon blue">🤖</div>
                <div class="stat-info">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">智能体总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">✨</div>
                <div class="stat-info">
                    <div class="stat-value" id="publishedCount">0</div>
                    <div class="stat-label">已发布</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">📝</div>
                <div class="stat-info">
                    <div class="stat-value" id="draftCount">0</div>
                    <div class="stat-label">草稿</div>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                <button class="filter-btn" onclick="setFilter('published', this)">已发布</button>
                <button class="filter-btn" onclick="setFilter('draft', this)">草稿</button>
            </div>
        </div>

        <div class="agents-grid" id="agentsGrid"></div>
    </div>

    <div class="confirm-modal-overlay" id="confirmModal">
        <div class="confirm-modal">
            <h3>确认删除</h3>
            <p id="confirmText">确定要删除这个智能体吗？此操作不可恢复。</p>
            <div class="confirm-modal-actions">
                <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="confirm-btn confirm-btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script>
        let allAgents = [];
        let currentFilter = 'all';
        let deleteTargetId = null;

        function showToast(msg, type) {
            type = type || 'success';
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 2500);
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + ' 天前';
            return d.toLocaleDateString('zh-CN');
        }

        async function loadAgents() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch('/api/agents', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/';
                    return;
                }
                if (!response.ok) throw new Error('加载失败');

                allAgents = await response.json();
                updateStats();
                renderAgents();
            } catch (err) {
                showToast('加载智能体列表失败', 'error');
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allAgents.length;
            document.getElementById('publishedCount').textContent = allAgents.filter(function(a) { return a.is_published; }).length;
            document.getElementById('draftCount').textContent = allAgents.filter(function(a) { return !a.is_published; }).length;
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderAgents();
        }

        function renderAgents() {
            const grid = document.getElementById('agentsGrid');
            let filtered = allAgents;
            if (currentFilter === 'published') filtered = allAgents.filter(function(a) { return a.is_published; });
            else if (currentFilter === 'draft') filtered = allAgents.filter(function(a) { return !a.is_published; });

            if (filtered.length === 0) {
                if (allAgents.length === 0) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🤖</div><div class="empty-state-title">还没有任何智能体</div><div class="empty-state-desc">创建你的第一个智能体，让 AI 为你工作</div><button class="empty-state-btn" onclick="openCreateModal()">✨ 创建智能体</button></div>';
                } else {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📭</div><div class="empty-state-title">暂无' + (currentFilter === 'published' ? '已发布的' : '草稿') + '智能体</div><div class="empty-state-desc">切换筛选条件查看全部</div></div>';
                }
                return;
            }

            grid.innerHTML = filtered.map(function(a) {
                return '<div class="agent-card" onclick="goEditor(' + a.id + ')">' +
                    '<div class="agent-card-header">' +
                        '<div class="agent-card-avatar">' + (a.avatar || '🤖') + '</div>' +
                        '<div class="agent-card-info">' +
                            '<div class="agent-card-name">' +
                                a.name +
                                (a.is_published ? '<span class="agent-publish-badge">已发布</span>' : '<span class="agent-draft-badge">草稿</span>') +
                            '</div>' +
                            '<div class="agent-card-desc">' + (a.description || '暂无描述') + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="agent-card-meta">' +
                        '<div class="agent-card-date">⏱ ' + formatDate(a.updated_at || a.created_at) + '</div>' +
                        '<div class="agent-card-actions" onclick="event.stopPropagation()">' +
                            '<button class="agent-action-btn" title="编辑" onclick="goEditor(' + a.id + ')">' +
                                '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                            '</button>' +
                            '<button class="agent-action-btn danger" title="删除" onclick="openConfirmDelete(' + a.id + ', \'' + a.name.replace(/'/g, "\\'") + '\')">' +
                                '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function goEditor(id) {
            window.location.href = '/agent-editor?id=' + id;
        }

        function openCreateModal() {
            window.location.href = '/agent-editor';
        }

        function openConfirmDelete(id, name) {
            deleteTargetId = id;
            document.getElementById('confirmText').textContent = '确定要删除智能体 "' + name + '" 吗？此操作不可恢复。';
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            deleteTargetId = null;
            document.getElementById('confirmModal').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('confirmDeleteBtn').onclick = async function() {
                if (!deleteTargetId) return;
                const token = localStorage.getItem('authToken');
                try {
                    const response = await fetch('/api/agents/' + deleteTargetId, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (!response.ok) throw new Error('删除失败');
                    showToast('删除成功');
                    closeConfirmModal();
                    loadAgents();
                } catch (err) {
                    showToast('删除失败', 'error');
                }
            };
            loadAgents();
        });
    </script>
</body>
</html>
