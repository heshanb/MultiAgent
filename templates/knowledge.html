<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .kb-page { display: flex; flex-direction: column; height: 100vh; }

        .panel-header {
            padding: 16px 28px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: white;
        }
        .panel-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-header h2 .header-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: white;
        }
        .back-btn {
            padding: 7px 20px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            color: #555;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .back-btn:hover { border-color: #667eea; color: #667eea; background: #f5f7ff; }

        .complete-btn {
            padding: 7px 22px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .complete-btn:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(102,126,234,0.35); }
        .complete-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .settings-btn {
            padding: 7px 18px;
            border: 1px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .settings-btn:hover { background: #f5f7ff; box-shadow: 0 2px 8px rgba(102,126,234,0.2); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
        }

        #viewContainer { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #kbDetailArea { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .panel-form-card {
            width: 600px;
            max-width: 100%;
            margin: 10px auto;
            background: white;
            border-radius: 14px;
            border: 1px solid #f0f0f0;
            padding: 20px;
        }
        .panel-form-card .form-group { margin-bottom: 20px; }
        .panel-form-card .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .panel-form-card .form-group input,
        .panel-form-card .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }
        .panel-form-card .form-group input:focus,
        .panel-form-card .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .panel-form-card .form-group textarea { resize: vertical; min-height: 100px; }

        .panel-btn {
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .panel-btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .panel-btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .panel-btn-secondary { background: #f5f5f5; color: #666; }
        .panel-btn-secondary:hover { background: #eee; }
        .panel-btn-danger { background: #fff0f0; color: #ff4757; }
        .panel-btn-danger:hover { background: #ffe0e0; }

        .panel-btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }

        .kb-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .kb-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 14px 14px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            min-width: 0;
        }
        .kb-card:hover { border-color: #667eea; box-shadow: 0 4px 16px rgba(102,126,234,0.1); transform: translateY(-1px); }
        .kb-card.active { border-color: #667eea; background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%); box-shadow: 0 2px 12px rgba(102,126,234,0.15); }
        .kb-card .kc-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4facfe, #005bea);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: white;
            flex-shrink: 0;
        }
        .kb-card.active .kc-icon { background: linear-gradient(135deg, #667eea, #5a67d8); }
        .kb-card .kc-info { flex: 1; min-width: 0; }
        .kb-card .kc-info h4 {
            margin: 0 0 3px 0;
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kb-card .kc-info p {
            margin: 0;
            font-size: 0.76rem;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kb-card .kc-menu { position: relative; flex-shrink: 0; }
        .kb-card .kc-menu-btn {
            width: 28px; height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #999;
            font-size: 1.1rem;
            transition: all 0.15s;
        }
        .kb-card .kc-menu-btn:hover { background: #f0f0f0; color: #666; }
        .kb-card.active .kc-menu-btn:hover { background: rgba(102,126,234,0.15); color: #667eea; }

        .kb-menu-dropdown {
            position: absolute;
            top: 32px; right: 0;
            min-width: 110px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border: 1px solid #eee;
            z-index: 100;
            overflow: hidden;
            animation: kbMenuIn 0.15s ease;
        }
        @keyframes kbMenuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .kb-menu-dropdown .kb-menu-item {
            padding: 9px 14px;
            font-size: 0.85rem;
            color: #555;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.12s;
        }
        .kb-menu-dropdown .kb-menu-item:hover { background: #f5f7ff; color: #667eea; }
        .kb-menu-dropdown .kb-menu-item.danger:hover { background: #fff0f0; color: #ff4757; }

        /* 召回测试页面样式 */
        .retrieval-test-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: calc(100vh - 120px);
            min-height: 500px;
        }
        .rt-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .rt-input-section {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e8ecff;
            flex-shrink: 0;
        }
        .rt-query-input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #d0d5e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            min-height: 200px;
            resize: vertical;
        }
        .rt-query-input:focus { border-color: #667eea; }
        .rt-test-btn {
            margin-top: 10px;
            width: 120px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: block;
        }
        .rt-test-btn:hover { opacity: 0.9; }
        .rt-history-section {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e8ecff;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .rt-history-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .rt-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rt-history-item {
            padding: 10px 12px;
            background: #f8faff;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .rt-history-item:hover { background: #eef1ff; border-color: #d0d5e0; }
        .rt-history-query {
            font-size: 0.85rem;
            color: #333;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rt-history-meta {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }
        .rt-right {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e8ecff;
            overflow-y: auto;
            padding: 16px;
        }
        .rt-right-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: #333;
            padding: 0 4px 12px 4px;
            border-bottom: 1px solid #e8ecff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
        }
        .rt-right-header::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .rt-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 0.9rem;
            text-align: center;
        }
        .rt-result-card {
            padding: 14px;
            background: #f8faff;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #e8ecff;
        }
        .rt-result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .rt-result-chunk {
            font-size: 0.8rem;
            font-weight: 600;
            color: #667eea;
            background: #eef1ff;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .rt-result-length, .rt-result-score, .rt-result-source {
            font-size: 0.75rem;
            color: #888;
        }
        .rt-result-score { color: #52c41a; }
        .rt-result-source { color: #667eea; }
        .rt-result-content {
            font-size: 0.85rem;
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .kb-empty-guide {
            text-align: center;
            padding: 60px 20px 40px;
            animation: fadeSlideIn 0.3s ease;
        }
        .kb-empty-guide .keg-illustration { margin-bottom: 24px; opacity: 0.95; }
        .kb-empty-guide .keg-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }
        .kb-empty-guide .keg-steps {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            background: linear-gradient(135deg, #f8faff, #f5f0ff);
            border-radius: 30px;
            border: 1px solid #e8ecff;
        }
        .kb-empty-guide .keg-step {
            font-size: 0.82rem;
            color: #555;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .kb-empty-guide .keg-step i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 0.7rem;
            font-style: normal;
            font-weight: 600;
        }
        .kb-empty-guide .keg-step-arrow { color: #c0c0c0; font-size: 0.8rem; }

        .kb-selected-hint {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            margin-top: 20px;
            background: linear-gradient(135deg, #eef7ff, #f3f0ff);
            border-radius: 12px;
            border: 1px solid #d0e0ff;
            animation: fadeSlideIn 0.25s ease;
        }
        .kb-selected-hint .ksh-check {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(40,167,69,0.25);
        }
        .kb-selected-hint .ksh-text .ksh-title { font-size: 0.92rem; font-weight: 600; color: #333; margin-bottom: 4px; }
        .kb-selected-hint .ksh-text .ksh-desc { font-size: 0.82rem; color: #666; }
        .kb-selected-hint .ksh-dots {
            display: inline-block;
            padding: 1px 6px;
            background: #e8e8e8;
            border-radius: 4px;
            font-weight: 600;
            color: #555;
            margin: 0 2px;
        }

        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .kb-detail-wrapper { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
        .kb-detail-wrapper .kb-detail-back { display: flex; align-items: center; justify-content: flex-end; }

        .kb-three-col {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr);
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        .kb-three-col .col {
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .kb-three-col .col-header {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.88rem;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafbfc;
        }
        .kb-three-col .col-header .ch-count {
            font-size: 0.76rem;
            color: #999;
            font-weight: normal;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .kb-three-col .col-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

        .col-edit-info .kb-edit-meta { padding: 4px 0 16px; }
        .col-edit-info .form-group { margin-bottom: 14px; }
        .col-edit-info .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 0.82rem; font-weight: 500; }
        .col-edit-info .form-group input,
        .col-edit-info .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.88rem;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: inherit;
            background: #fafafa;
        }
        .col-edit-info .form-group input:focus,
        .col-edit-info .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            background: white;
        }
        .col-edit-info .form-group textarea { resize: vertical; min-height: 60px; }

        .chunk-strategy-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .strategy-card {
            border: 1.5px solid #e8e8e8;
            border-radius: 10px;
            padding: 14px 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
            text-align: center;
        }
        .strategy-card:hover { border-color: #c7d2fe; background: #f5f7ff; transform: translateY(-1px); }
        .strategy-card.active { border-color: #667eea; background: linear-gradient(135deg, #eef2ff, #f0e7ff); box-shadow: 0 2px 10px rgba(102,126,234,0.18); }
        .strategy-card .sc-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .strategy-card .sc-name { font-size: 0.88rem; font-weight: 600; color: #333; margin-bottom: 4px; }
        .strategy-card .sc-desc { font-size: 0.72rem; color: #888; line-height: 1.4; }
        .strategy-card.active .sc-name { color: #5a67d8; }

        .chunk-advanced-config {
            margin-top: 12px;
            padding: 12px;
            background: #f8f9fb;
            border: 1px solid #eceef2;
            border-radius: 8px;
            display: none;
        }
        .chunk-advanced-config.show { display: block; }
        .cac-row { display: flex; gap: 12px; margin-bottom: 10px; }
        .cac-item { flex: 1; }
        .cac-item label { display: block; font-size: 0.78rem; color: #555; margin-bottom: 4px; font-weight: 500; }
        .cac-item input[type="number"],
        .cac-item input[type="text"] {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.82rem;
            box-sizing: border-box;
        }
        .cac-item input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.12); }
        .cac-hint { font-size: 0.7rem; color: #999; margin-top: 4px; }
        .pc-block { margin-bottom: 12px; padding: 10px; background: #fff; border: 1px solid #e6e8ef; border-radius: 8px; }
        .pc-block:last-child { margin-bottom: 0; }
        .pc-block-title { font-size: 0.82rem; font-weight: 600; color: #333; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #e6e8ef; }

        .doc-upload-area {
            border: 2px dashed #d0d0d0;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }
        .doc-upload-area:hover { border-color: #667eea; background: #f5f7ff; }
        .doc-upload-area.dragover { border-color: #667eea; background: #eef0ff; }
        .doc-upload-area .upload-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .doc-upload-area .upload-text { font-size: 0.82rem; color: #666; margin-bottom: 2px; }
        .doc-upload-area .upload-hint { font-size: 0.72rem; color: #999; }

        .doc-list-title { font-size: 0.82rem; color: #666; font-weight: 500; margin: 14px 0 8px; display: flex; align-items: center; justify-content: space-between; }
        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background: #fafafa;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #f0f0f0;
            transition: border-color 0.15s;
        }
        .doc-item:hover { border-color: #e0e0e0; }
        .doc-item .di-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .doc-item .di-icon { font-size: 1.1rem; flex-shrink: 0; }
        .doc-item .di-info { display: flex; flex-direction: column; min-width: 0; }
        .doc-item .di-name { font-size: 0.82rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-item .di-size { font-size: 0.7rem; color: #999; }
        .doc-item .di-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .doc-item .di-actions button { border: none; background: transparent; cursor: pointer; padding: 4px 8px; font-size: 0.75rem; border-radius: 5px; transition: all 0.15s; }
        .doc-item .di-actions .di-replace { color: #667eea; }
        .doc-item .di-actions .di-replace:hover { background: #eef0ff; }
        .doc-item .di-actions .di-del { color: #ff4757; }
        .doc-item .di-actions .di-del:hover { background: #fff0f0; }

        .kb-create-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr);
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        .kb-create-layout .col {
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .kb-create-layout .col-header {
            padding: 14px 16px;

<body>
    <div class="kb-page">
        <div class="panel-header">
            <h2 id="pageTitle"><span class="header-icon">📚</span>我的知识库</h2>
            <div class="header-actions">
                <button class="complete-btn" id="completeBtn" onclick="completeKBCreate()" style="display:none;">完成</button>
                <button class="settings-btn" id="settingsBtn" onclick="saveEditDocSettings()" style="display:none;">⚙️ 设置</button>
                <button class="back-btn" id="backBtn" onclick="goBack()">返回对话</button>
            </div>
        </div>
        <div class="panel-body" id="panelBody">
            <div id="viewContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let authToken = localStorage.getItem('authToken');
        let currentKbId = null;
        let kbDetailMode = 'edit';
        let pendingKBCreate = null;
        let pendingKBDocs = [];
        let kbDropdownEl = null;
        let currentView = 'list';
        let currentDetailMode = 'edit';
        let editDocs = [];
        let selectedEditDocId = null;
        let editDetailLoaded = false;
        let justSavedDoc = null;

        function isEmbedded() {
            return window.self !== window.top;
        }

        function goBack() {
            if (currentView === 'create-detail') {
                showCreateView();
                return;
            }
            if (currentView === 'detail' || currentView === 'retrieval-test') {
                backToList();
                return;
            }
            if (isEmbedded()) {
                window.parent.postMessage({ type: 'goBack' }, '*');
            } else {
                window.location.href = '/';
            }
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function showConfirm(options) {
            return new Promise(function(resolve) {
                if (typeof options === 'string') options = { message: options };
                var iconMap = { danger: '⚠️', warning: '⚠️', info: '💡', success: '✅' };
                var opts = Object.assign({
                    title: options.title || '提示',
                    message: options.message || '',
                    icon: options.icon || 'info',
                    confirmText: options.confirmText || '确定',
                    cancelText: options.cancelText || '取消',
                    type: options.type || 'default',
                    input: options.input || false,
                    inputPlaceholder: options.inputPlaceholder || '',
                    inputValue: options.inputValue || ''
                }, options);

                var overlay = document.createElement('div');
                overlay.className = 'confirm-overlay';
                var box = '<div class="confirm-box">';
                box += '<div class="confirm-icon ' + opts.icon + '">' + iconMap[opts.icon] + '</div>';
                box += '<h4 class="confirm-title">' + opts.title + '</h4>';
                box += '<div class="confirm-msg">' + opts.message + '</div>';
                if (opts.input) {
                    box += '<input class="confirm-input" placeholder="' + opts.inputPlaceholder + '" value="' + (opts.inputValue || '') + '" />';
                }
                box += '<div class="confirm-btns">';
                box += '<button class="btn-cancel">' + opts.cancelText + '</button>';
                box += '<button class="btn-confirm ' + opts.type + '">' + opts.confirmText + '</button>';
                box += '</div></div>';
                overlay.innerHTML = box;
                document.body.appendChild(overlay);

                var inputEl = overlay.querySelector('.confirm-input');
                var confirmBtn = overlay.querySelector('.btn-confirm');
                var cancelBtn = overlay.querySelector('.btn-cancel');

                function cleanup() { document.body.removeChild(overlay); }

                function doConfirm() {
                    var val = inputEl ? inputEl.value : true;
                    cleanup();
                    resolve(val);
                }
                function doCancel() { cleanup(); resolve(inputEl ? null : false); }

                confirmBtn.onclick = doConfirm;
                cancelBtn.onclick = doCancel;
                overlay.onclick = function(e) { if (e.target === overlay) doCancel(); };
                document.addEventListener('keydown', escClose);
                function escClose(e) {
                    if (e.key === 'Escape') { doCancel(); document.removeEventListener('keydown', escClose); }
                    if (e.key === 'Enter' && !opts.input) { doConfirm(); document.removeEventListener('keydown', escClose); }
                }
                if (inputEl) setTimeout(function() { inputEl.focus(); inputEl.select(); }, 50);
            });
        }

        function esc(s) {
            if (!s) return '';
            var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        async function runRetrievalTest() {
            var input = document.getElementById('rtQueryInput');
            if (!input) return;
            var query = input.value.trim();
            if (!query) { showToast('请输入召回测试问题'); return; }

            var resultsArea = document.getElementById('rtResultsArea');
            if (resultsArea) resultsArea.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">检索中...</div>';

            try {
                var r = await fetch('/api/knowledge/search?query=' + encodeURIComponent(query) + '&kb_id=' + encodeURIComponent(currentKbId) + '&k=10', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('检索失败');
                var data = await r.json();
                var results = data.results || [];

                retrievalTestHistory.unshift({ query: query, time: new Date().toLocaleTimeString(), count: results.length });
                renderRetrievalHistory();
                renderRetrievalResults(results);
            } catch(e) {
                if (resultsArea) resultsArea.innerHTML = '<div style="text-align:center;padding:40px;color:#f56c6c;">检索失败：' + esc(e.message || '未知错误') + '</div>';
            }
        }

        function renderRetrievalHistory() {
            var list = document.getElementById('rtHistoryList');
            if (!list) return;
            if (retrievalTestHistory.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">暂无测试记录</div>';
                return;

            list.innerHTML = retrievalTestHistory.map(function(h) {
                return '<div class="rt-history-item" onclick="replayRetrievalTest(\'' + esc(h.query).replace(/'/g, "\\'") + '\')">' +
                    '<div class="rt-history-query">' + esc(h.query) + '</div>' +
                    '<div class="rt-history-meta">' + h.time + ' · ' + h.count + ' 个结果</div>' +
                '</div>';
            }).join('');
        }

        function replayRetrievalTest(query) {
            var input = document.getElementById('rtQueryInput');
            if (input) input.value = query;
            runRetrievalTest();
        }

        function renderRetrievalResults(results) {
            var area = document.getElementById('rtResultsArea');

            }).join('');
        }

        async function handleKBCreate() {
            var name = document.getElementById('kbCreateName').value.trim();
            var desc = document.getElementById('kbCreateDesc').value.trim();
            if (!name) { showToast('请输入知识库名称'); return; }

            // 检查名称是否重复
            try {
                var r = await fetch('/api/knowledge/bases', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (r.ok) {
                    var data = await r.json();
                    var bases = data.bases || [];
                    var exists = bases.find(function(b) { return b.name === name; });
                    if (exists) { showToast('知识库名称"' + name + '"已存在，请换一个名称'); return; }
                }
            } catch(e) {
                // 网络异常时不阻断创建，让后端再校验
            }

            pendingKBDocs = [];
            pendingKBCreate = {
                name: name,
                description: desc,
                chunk_strategy: 'standard',
                chunk_size: "",
                chunk_overlap: "",
                separators: [],
                parent_chunk_size: "",
                parent_chunk_overlap: "",
                parent_separators: [],
                child_chunk_size: "",
                child_chunk_overlap: "",
                child_separators: [],
                rag_config: {
                    retrieval_mode: 'hybrid',
                    embedding_model: 'text-embedding-v4',
                    rerank_enabled: false,
                    rerank_model: 'bge-reranker-large',
                    rerank_top_k: 3
                }
            };
            currentKbId = 'pending';
            kbDetailMode = 'create';
            currentDetailMode = 'create';
            currentView = 'create-detail';
            setPageTitle('📚', '创建知识库 <span style="font-weight:bold;color:#000;margin-left:8px;">' + name + '</span>', '返回创建', true);

            var container = document.getElementById('viewContainer');
            container.innerHTML = '<div id="kbDetailArea"></div>';
            renderKnowledgeDetail('pending', 'create');
        }

        async function completeKBCreate() {
            if (!pendingKBCreate) { showToast('没有待完成的创建'); return; }
            var configuredDocs = pendingKBDocs.filter(function(d) { return d.configured; });
            if (configuredDocs.length === 0) { showToast('请至少为一个文档设置切片策略'); return; }

            var btn = document.getElementById('completeBtn');
            if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }

            var p = pendingKBCreate;
            var rag = p.rag_config || {};

            try {
                // 1. 生成临时 kb_id 并先创建目录（不写数据库）
                var tempKbId = 'kb_' + Math.random().toString(36).slice(2, 14);

                // 2. 逐个上传并向量化
                for (var i = 0; i < configuredDocs.length; i++) {
                    var d = configuredDocs[i];
                    await uploadSingleKBFile(d.file, tempKbId, {
                        chunk_strategy: d.chunk_strategy,
                        chunk_size: d.chunk_size,
                        chunk_overlap: d.chunk_overlap,
                        separators: d.separators,
                        parent_chunk_size: d.parent_chunk_size,
                        parent_chunk_overlap: d.parent_chunk_overlap,
                        parent_separators: d.parent_separators,
                        child_chunk_size: d.child_chunk_size,
                        child_chunk_overlap: d.child_chunk_overlap,
                        child_separators: d.child_separators
                    });
                }

                // 3. 全部向量化成功后，才写入 knowledges 表
                var params = new URLSearchParams();
                params.append('name', p.name);
                params.append('description', p.description || '');
                params.append('chunk_strategy', configuredDocs[0].chunk_strategy || 'standard');

                var firstDoc = configuredDocs[0];
                if (firstDoc.chunk_strategy === 'parent_child') {
                    if (firstDoc.parent_chunk_size) params.append('parent_chunk_size', firstDoc.parent_chunk_size);
                    if (firstDoc.parent_chunk_overlap) params.append('parent_chunk_overlap', firstDoc.parent_chunk_overlap);
                    if (firstDoc.parent_separators) params.append('parent_separators', JSON.stringify(firstDoc.parent_separators));
                    if (firstDoc.child_chunk_size) params.append('child_chunk_size', firstDoc.child_chunk_size);
                    if (firstDoc.child_chunk_overlap) params.append('child_chunk_overlap', firstDoc.child_chunk_overlap);
                    if (firstDoc.child_separators) params.append('child_separators', JSON.stringify(firstDoc.child_separators));
                } else if (firstDoc.chunk_strategy !== 'qa') {
                    if (firstDoc.chunk_size) params.append('chunk_size', firstDoc.chunk_size);
                    if (firstDoc.chunk_overlap) params.append('chunk_overlap', firstDoc.chunk_overlap);
                    if (firstDoc.separators) params.append('separators', JSON.stringify(firstDoc.separators));
                }

                var fileRagConfigs = {};
                configuredDocs.forEach(function(d) {
                    var rc = d.rag_config || {};
                    var cs = {};
                    if (d.chunk_strategy === 'parent_child') {
                        cs = {
                            strategy: 'parent_child',
                            parent_chunk_size: d.parent_chunk_size,
                            parent_chunk_overlap: d.parent_chunk_overlap,
                            parent_separators: d.parent_separators,
                            child_chunk_size: d.child_chunk_size,
                            child_chunk_overlap: d.child_chunk_overlap,
                            child_separators: d.child_separators
                        };
                    } else if (d.chunk_strategy === 'qa') {
                        cs = { strategy: 'qa' };
                    } else {
                        cs = {
                            strategy: d.chunk_strategy || 'standard',
                            chunk_size: d.chunk_size,
                            chunk_overlap: d.chunk_overlap,
                            separators: d.separators
                        };
                    }
                    fileRagConfigs[d.name] = {
                        chunk_strategy: cs,
                        rag_retrieve_method: rc.rag_retrieve_method || 'similarity',
                        embedding_model_name: rc.embedding_model_name || 'text-embedding-v4',
                        rerank_model_setting: rc.rerank_model_setting || { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 }
                    };
                });
                params.append('file_rag_configs', JSON.stringify(fileRagConfigs));
                params.append('kb_id', tempKbId);

                var r = await fetch('/api/knowledge/bases?' + params.toString(), {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.detail || '创建知识库记录失败'); }
                var kb = await r.json();

                pendingKBCreate = null;
                pendingKBDocs = [];
                currentKbId = null;

                showToast('✅ 知识库创建成功，已上传 ' + configuredDocs.length + ' 个文档');

                showCreateView();
            } catch(e) {
                // 向量化失败，弹窗提示具体原因
                showConfirm({
                    title: '创建失败',
                    message: '文档向量化存入向量数据库失败：\n' + (e.message || e),
                    icon: 'danger',
                    confirmText: '知道了',
                    cancelText: '',
                    type: 'danger'
                });
                if (btn) { btn.disabled = false; btn.textContent = '完成'; }
            }
        }

        function toggleAdvancedConfig(mode, strategy) {
            var prefix = mode === 'create' ? 'kbCreate' : 'kbEdit';
            var cfg = document.getElementById(prefix + 'AdvancedConfig');
            if (!cfg) return;
            var stdGroup = document.getElementById(prefix + 'StandardGroup');
            var pcGroup = document.getElementById(prefix + 'ParentChildGroup');
            if (strategy === 'qa') {
                cfg.classList.remove('show');
            } else {
                cfg.classList.add('show');
                if (strategy === 'parent_child') {
                    if (stdGroup) stdGroup.style.display = 'none';
                    if (pcGroup) pcGroup.style.display = '';
                } else {
                    if (stdGroup) stdGroup.style.display = '';
                    if (pcGroup) pcGroup.style.display = 'none';
                }
            }
        }

        function selectKBStrategy(mode, strategy) {
            if (mode === 'create') {
                pendingKBCreate.chunk_strategy = strategy;
                var cards = document.querySelectorAll('#kbCreateStrategySelector .strategy-card');
                cards.forEach(function(c) { c.classList.remove('active'); });
                var active = document.querySelector('#kbCreateStrategySelector .strategy-card[data-strategy="' + strategy + '"]');
                if (active) active.classList.add('active');
                toggleAdvancedConfig('create', strategy);
                refreshPreviewToggleState();
            } else if (mode === 'edit') {
                var cards = document.querySelectorAll('#kbEditStrategySelector .strategy-card');
                cards.forEach(function(c) { c.classList.remove('active'); });
                var active = document.querySelector('#kbEditStrategySelector .strategy-card[data-strategy="' + strategy + '"]');
                if (active) active.classList.add('active');
                updateKBMeta('chunk_strategy', strategy);
                toggleAdvancedConfig('edit', strategy);
            }
        }

            if (mode === 'edit') {
                if (!currentKbId) { showToast('请先选择知识库'); return; }

        async function uploadSingleKBFile(file, kbId, strategy) {
            var fd = new FormData();
            fd.append('file', file);
            var url = '/api/knowledge/upload?kb_id=' + encodeURIComponent(kbId);
            var rag = (strategy && strategy.rag_config) ? strategy.rag_config : ((pendingKBCreate && pendingKBCreate.rag_config) ? pendingKBCreate.rag_config : {});
            url += '&embedding_model=' + encodeURIComponent(rag.embedding_model_name || 'text-embedding-v4');
            url += '&retrieval_mode=' + encodeURIComponent(rag.rag_retrieve_method === 'hybrid' ? 'hybrid' : 'vector');
            if (strategy) {
                url += '&chunk_strategy=' + encodeURIComponent(strategy.chunk_strategy || 'standard');
                if (strategy.chunk_strategy === 'parent_child') {
                    if (strategy.parent_chunk_size) url += '&parent_chunk_size=' + strategy.parent_chunk_size;
                    if (strategy.parent_chunk_overlap) url += '&parent_chunk_overlap=' + strategy.parent_chunk_overlap;
                    if (strategy.parent_separators) url += '&parent_separators=' + encodeURIComponent(JSON.stringify(strategy.parent_separators));
                    if (strategy.child_chunk_size) url += '&child_chunk_size=' + strategy.child_chunk_size;
                    if (strategy.child_chunk_overlap) url += '&child_chunk_overlap=' + strategy.child_chunk_overlap;
                    if (strategy.child_separators) url += '&child_separators=' + encodeURIComponent(JSON.stringify(strategy.child_separators));
                } else if (strategy.chunk_strategy !== 'qa') {
                    if (strategy.chunk_size) url += '&chunk_size=' + strategy.chunk_size;
                    if (strategy.chunk_overlap) url += '&chunk_overlap=' + strategy.chunk_overlap;
                    if (strategy.separators) url += '&separators=' + encodeURIComponent(JSON.stringify(strategy.separators));
                }
            }
            var r = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + authToken },
                body: fd
            });
            if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.detail || '上传失败'); }
            return r.json();
        }

        function updateEditRAGSetting(field, value) {
            var doc = editDocs.find(function(d) { return d.id === selectedEditDocId; });

            if (!doc.rag_config) {
                doc.rag_config = { rag_retrieve_method: 'similarity', embedding_model_name: 'text-embedding-v4', rerank_model_setting: { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 } };
            }
            var rc = doc.rag_config;
            if (field === 'retrieval_mode') {
                rc.rag_retrieve_method = (value === 'hybrid') ? 'hybrid' : 'similarity';
            } else if (field === 'embedding_model') {
                rc.embedding_model_name = value;
            } else if (field === 'rerank_model') {
                if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                rc.rerank_model_setting.rerank_model = value;

                if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };

            } else {
                rc[field] = value;

        async function updateKBMeta(field, val) {
            if (!currentKbId || currentKbId === 'pending') {
                if (pendingKBCreate) {
                    if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                        try {
                            val = JSON.parse('[' + val + ']');
                        } catch(e) {
                            val = String(val).split(',').map(function(s){ return s.trim(); }).filter(Boolean);
                        }
                    } else {
                        val = (field.indexOf('size') >= 0 || field.indexOf('overlap') >= 0) ? parseInt(val) : val;
                    }
                    pendingKBCreate[field] = val;
                    // 同步到当前选中的 doc
                    var sDoc = pendingKBDocs.find(function(d) { return d.selected; });
                    if (sDoc) sDoc[field] = val;
                    refreshPreviewToggleState();
                }
                return;
            }
            if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                try { val = JSON.parse('[' + val + ']'); } catch(e) { val = String(val).split(',').map(function(s){ return s.trim(); }).filter(Boolean); }
            } else {
                val = (field.indexOf('size') >= 0 || field.indexOf('overlap') >= 0) ? parseInt(val) : val;
            }
            try {
                var qs = new URLSearchParams();
                if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                    qs.append(field, JSON.stringify(val));
                } else {
                    qs.append(field, val);
                }
                var r = await fetch('/api/knowledge/bases/' + encodeURIComponent(currentKbId) + '?' + qs.toString(), {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('更新失败');
                showToast('已更新');
            } catch(e) { showToast(e.message || '更新失败'); }
        }

        async function deleteDoc(docId) {
            if (!await showConfirm({ message: '确定删除该文档？', icon: 'warning', confirmText: '删除', type: 'danger' })) return;
            try {
                var r = await fetch('/api/knowledge/documents/' + encodeURIComponent(docId), {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('删除失败');
                showToast('文档已删除');
                renderKnowledgeDetail(currentKbId, 'edit');
            } catch(e) { showToast(e.message || '删除失败'); }
        }

        function replaceDoc(docId) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.docx,.doc,.txt,.md,.xlsx,.xls,.pptx,.ppt,.html,.json';
            input.onchange = async function() {
                if (!input.files || !input.files[0]) return;
                var fd = new FormData();
                fd.append('file', input.files[0]);
                try {
                    var r = await fetch('/api/knowledge/documents/' + encodeURIComponent(docId), {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: fd
                    });
                    if (!r.ok) throw new Error('替换失败');
                    showToast('文档已替换');
                    renderKnowledgeDetail(currentKbId, 'edit');
                } catch(e) { showToast(e.message || '替换失败'); }
            };
            input.click();
        }

        async function doRecallTest() {
            var queryEl = document.getElementById('kbRecallQuery');
            if (!queryEl) return;
            var query = queryEl.innerText.trim();
            if (!query) { showToast('请输入测试文本'); return; }
            var resultEl = document.getElementById('kbRecallResult');
            var statusEl = document.getElementById('kbRecallStatus');
            resultEl.innerHTML = '<div style="text-align:center;padding:40px;color:#999;"><div class="spinner-small"></div><div style="margin-top:8px;font-size:0.82rem;">测试中...</div></div>';
            statusEl.textContent = '测试中';
            try {
                var params = new URLSearchParams();
                params.append('query', query);
                params.append('kb_id', currentKbId);
                params.append('top_k', 10);
                var r = await fetch('/api/knowledge/retrieve?' + params.toString(), {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('召回失败');
                var data = await r.json();
                var chunks = data.chunks || data.results || [];
                statusEl.textContent = chunks.length + ' 条结果';
                if (chunks.length === 0) {
                    resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;font-size:0.85rem;">未召回相关片段</div>';
                } else {
                    var html = '';
                    chunks.forEach(function(chunk, idx) {
                        var rank = idx + 1;
                        var score = chunk.score != null ? (typeof chunk.score === 'number' ? chunk.score.toFixed(4) : chunk.score) : '';
                        var content = chunk.content || chunk.text || '';
                        var source = chunk.source || chunk.filename || chunk.doc_name || '';
                        html += '<div class="rr-item">';
                        html += '<div class="rr-head"><div class="rr-rank-score"><div class="rr-rank ' + (rank <= 3 ? 'top' + rank : '') + '">' + rank + '</div>' + (score ? '<span class="rr-score">' + score + '</span>' : '') + '</div><span class="rr-source" title="' + esc(source) + '">' + esc(source) + '</span></div>';
                        html += '<div class="rr-content">' + esc(content) + '</div>';
                        html += '</div>';
                    });
                    resultEl.innerHTML = html;
                }
                var history = _loadRecallHistory();
                history.unshift(query);
                _saveRecallHistory(history);
                renderRecallHistory();
            } catch(e) {
                statusEl.textContent = '测试失败';
                resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ff4757;font-size:0.85rem;">召回失败：' + e.message + '</div>';
            }
        }

        function clearRecallResult() {
            var queryEl = document.getElementById('kbRecallQuery');
            var resultEl = document.getElementById('kbRecallResult');
            var statusEl = document.getElementById('kbRecallStatus');
            if (queryEl) queryEl.innerText = '';
            if (resultEl) resultEl.innerHTML = '';
            if (statusEl) statusEl.textContent = '待测试';

        function renderRecallHistory() {
            var listEl = document.getElementById('kbRecallHistoryList');
            if (!listEl) return;
            var history = _loadRecallHistory();
            if (history.length === 0) {
                listEl.innerHTML = '<div class="qh-empty">暂无测试历史</div>';
                return;
            }
            var html = '';
            history.forEach(function(q) {
                html += '<div class="qh-item" onclick="document.getElementById(\'kbRecallQuery\').innerText=\'' + q.replace(/'/g, "\\'").replace(/\n/g, '\\n') + '\';">' + esc(q) + '</div>';
            });
            listEl.innerHTML = html;
        }

            _saveRecallHistory([]);
            renderRecallHistory();
        }

        function refreshPreviewToggleState() {
            const toggle = document.getElementById('previewChunkToggle');
            const label = toggle ? toggle.closest('label') : null;
            if (!toggle) return;
            var isEditMode = (currentDetailMode === 'edit' && currentKbId && currentKbId !== 'pending');
            var prefix = isEditMode ? 'kbEdit' : 'kbCreate';
            var strategy;
            if (isEditMode) {
                var selDoc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
                strategy = selDoc ? (selDoc.chunk_strategy || 'standard') : 'standard';
            } else {
                strategy = pendingKBCreate ? (pendingKBCreate.chunk_strategy || 'standard') : 'standard';
            }
            let allFilled = true;
            const getVal = function(id) {
                const el = document.getElementById(id);
                return el ? String(el.value).trim() : '';
            };
            if (strategy === 'parent_child') {
                allFilled = getVal(prefix + 'ParentChunkSize') !== '' &&
                            getVal(prefix + 'ParentChunkOverlap') !== '' &&
                            getVal(prefix + 'ParentSeparators') !== '' &&
                            getVal(prefix + 'ChildChunkSize') !== '' &&
                            getVal(prefix + 'ChildChunkOverlap') !== '' &&
                            getVal(prefix + 'ChildSeparators') !== '';
            } else if (strategy === 'qa') {
                allFilled = true;
            } else {
                allFilled = getVal(prefix + 'ChunkSize') !== '' &&
                            getVal(prefix + 'ChunkOverlap') !== '' &&
                            getVal(prefix + 'Separators') !== '';
            }
            toggle.disabled = !allFilled;
            if (label) {
                if (!allFilled) label.classList.add('preview-disabled');
                else label.classList.remove('preview-disabled');
            }
            if (!allFilled && toggle.checked) {
                toggle.checked = false;
                toggleChunkPreview(false);
            }
        }


        function fillDefaultChunkParams(prefix) {
            var defaults = {
                ChunkSize: 800,
                ChunkOverlap: 150,
                Separators: '\\n\\n,\\n,。,；,，, ,',
                ParentChunkSize: 1600,
                ParentChunkOverlap: 300,
                ParentSeparators: '\\n\\n,\\n,。,；,，, ,',
                ChildChunkSize: 800,
                ChildChunkOverlap: 150,
                ChildSeparators: '\\n\\n,\\n,。,；,，, ,'
            };
            Object.keys(defaults).forEach(function(key) {
                var el = document.getElementById(prefix + key);
                if (el) { el.value = defaults[key]; el.dispatchEvent(new Event('change')); }
            });
            // 同步默认值到当前选中的 doc
            var selectedDoc = pendingKBDocs.find(function(d) { return d.selected; });
            if (selectedDoc && pendingKBCreate) {
                selectedDoc.chunk_size = pendingKBCreate.chunk_size;
                selectedDoc.chunk_overlap = pendingKBCreate.chunk_overlap;
                selectedDoc.separators = pendingKBCreate.separators;
                selectedDoc.parent_chunk_size = pendingKBCreate.parent_chunk_size;
                selectedDoc.parent_chunk_overlap = pendingKBCreate.parent_chunk_overlap;
                selectedDoc.parent_separators = pendingKBCreate.parent_separators;
                selectedDoc.child_chunk_size = pendingKBCreate.child_chunk_size;
                selectedDoc.child_chunk_overlap = pendingKBCreate.child_chunk_overlap;
                selectedDoc.child_separators = pendingKBCreate.child_separators;

            showToast('已填充默认值');
            refreshPreviewToggleState();

        function updateRAGSetting(field, value) {
            if (pendingKBCreate) {
                if (!pendingKBCreate.rag_config) pendingKBCreate.rag_config = {};
                var rc = pendingKBCreate.rag_config;
                if (field === 'retrieval_mode') {
                    rc.rag_retrieve_method = (value === 'hybrid') ? 'hybrid' : 'similarity';
                } else if (field === 'embedding_model') {
                    rc.embedding_model_name = value;
                } else if (field === 'rerank_model') {
                    if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                    rc.rerank_model_setting.rerank_model = value;
                } else if (field === 'rerank_top_k') {
                    if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                    rc.rerank_model_setting.rerank_top_k = parseInt(value) || 3;
                } else {
                    rc[field] = value;
                }
            }
        }

                    area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">⚠️</div><div class="cpe-text">请先在左侧选择一个文档</div></div>';

                    chunk_overlap: parseInt(document.getElementById(prefix + 'ChunkOverlap')?.value) || doc.chunk_overlap || 150,
                    separators: doc.separators || ['\\n\\n','\\n','。','；','，',' ',''],
                    parent_chunk_size: parseInt(document.getElementById(prefix + 'ParentChunkSize')?.value) || doc.parent_chunk_size || 1600,
                    parent_chunk_overlap: parseInt(document.getElementById(prefix + 'ParentChunkOverlap')?.value) || doc.parent_chunk_overlap || 300,
                    parent_separators: doc.parent_separators || doc.separators || ['\\n\\n','\\n','。','；','，',' ',''],
                    child_chunk_size: parseInt(document.getElementById(prefix + 'ChildChunkSize')?.value) || doc.child_chunk_size || 800,
                    child_chunk_overlap: parseInt(document.getElementById(prefix + 'ChildChunkOverlap')?.value) || doc.child_chunk_overlap || 150,
                    child_separators: doc.child_separators || doc.separators || ['\\n\\n','\\n','。','；','，',' ','']
                };
            } else {
                const selectedIdx = getSelectedCreateDocIdx();
                if (selectedIdx === -1) {
                    area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">⚠️</div><div class="cpe-text">请先在左侧选择一个文档</div></div>';
                    return;
                }
                doc = pendingKBDocs[selectedIdx];
                strategy = pendingKBCreate ? (pendingKBCreate.chunk_strategy || 'standard') : 'standard';
                prefix = 'kbCreate';
                chunkParams = {
                    strategy: strategy,
                    chunk_size: parseInt(document.getElementById(prefix + 'ChunkSize')?.value) || 800,
                    chunk_overlap: parseInt(document.getElementById(prefix + 'ChunkOverlap')?.value) || 150,
                    separators: (pendingKBCreate?.separators || ['\\n\\n','\\n','。','；','，',' ','']),
                    parent_chunk_size: parseInt(document.getElementById(prefix + 'ParentChunkSize')?.value) || 1600,
                    parent_chunk_overlap: parseInt(document.getElementById(prefix + 'ParentChunkOverlap')?.value) || 300,
                    parent_separators: (pendingKBCreate?.parent_separators || pendingKBCreate?.separators || ['\\n\\n','\\n','。','；','，',' ','']),
                    child_chunk_size: parseInt(document.getElementById(prefix + 'ChildChunkSize')?.value) || 800,
                    child_chunk_overlap: parseInt(document.getElementById(prefix + 'ChildChunkOverlap')?.value) || 150,
                    child_separators: (pendingKBCreate?.child_separators || pendingKBCreate?.separators || ['\\n\\n','\\n','。','；','，',' ',''])
                };
            }

            // 显示加载中
            area.innerHTML = '<div class="chunk-preview-empty"><div class="spinner-small"></div><div class="cpe-text" style="margin-top:10px;">正在生成预览...</div></div>';

            try {
                let chunks = [];
                if (doc && doc.file) {
                    const formData = new FormData();
                    formData.append('file', doc.file);
                    const qs = new URLSearchParams();
                    qs.append('chunk_strategy', strategy);
                    qs.append('chunk_size', chunkParams.chunk_size);
                    qs.append('chunk_overlap', chunkParams.chunk_overlap);
                    if (chunkParams.separators) qs.append('separators', JSON.stringify(chunkParams.separators));
                    if (strategy === 'parent_child') {
                        qs.append('parent_chunk_size', chunkParams.parent_chunk_size);
                        qs.append('parent_chunk_overlap', chunkParams.parent_chunk_overlap);
                        if (chunkParams.parent_separators) qs.append('parent_separators', JSON.stringify(chunkParams.parent_separators));
                        qs.append('child_chunk_size', chunkParams.child_chunk_size);
                        qs.append('child_chunk_overlap', chunkParams.child_chunk_overlap);
                        if (chunkParams.child_separators) qs.append('child_separators', JSON.stringify(chunkParams.child_separators));
                    }

                    const r = await fetch('/api/knowledge/chunk_preview?' + qs.toString(), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: formData
                    });
                    if (r.ok) {
                        const data = await r.json();
                        chunks = data.chunks || [];
                    } else {
                        const errText = await r.text();
                        throw new Error('预览接口返回 ' + r.status + ': ' + errText);
                    }
                } else if (isEditMode && doc && doc.id) {
                    if (doc.on_disk === false || doc.on_disk === 'false') {
                        throw new Error('源文件不在磁盘，请先点击"替换"按钮重新上传该文档后再预览');
                    }
                    const fileResp = await fetch('/api/knowledge/files/' + encodeURIComponent(currentKbId) + '/' + encodeURIComponent(doc.filename || doc.id), {
                        headers: { 'Authorization': 'Bearer ' + authToken }
                    });
                    if (!fileResp.ok) {
                        if (fileResp.status === 404) {
                            throw new Error('文档文件不存在（可能已被删除或移动），请点击"替换"按钮重新上传该文档');
                        }
                        throw new Error('无法获取文档文件（HTTP ' + fileResp.status + '），无法预览');
                    }
                    const blob = await fileResp.blob();
                    const fetchedFile = new File([blob], doc.filename || doc.id, { type: blob.type });
                    const formData2 = new FormData();
                    formData2.append('file', fetchedFile);
                    const qs2 = new URLSearchParams();
                    qs2.append('chunk_strategy', strategy);
                    qs2.append('chunk_size', chunkParams.chunk_size);
                    qs2.append('chunk_overlap', chunkParams.chunk_overlap);
                    if (chunkParams.separators) qs2.append('separators', JSON.stringify(chunkParams.separators));
                    if (strategy === 'parent_child') {
                        qs2.append('parent_chunk_size', chunkParams.parent_chunk_size);
                        qs2.append('parent_chunk_overlap', chunkParams.parent_chunk_overlap);
                        if (chunkParams.parent_separators) qs2.append('parent_separators', JSON.stringify(chunkParams.parent_separators));
                        qs2.append('child_chunk_size', chunkParams.child_chunk_size);
                        qs2.append('child_chunk_overlap', chunkParams.child_chunk_overlap);
                        if (chunkParams.child_separators) qs2.append('child_separators', JSON.stringify(chunkParams.child_separators));
                    }
                    const r = await fetch('/api/knowledge/chunk_preview?' + qs2.toString(), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: formData2
                    });
                    if (r.ok) {
                        const data = await r.json();
                        chunks = data.chunks || [];
                    } else {
                        const errText = await r.text();
                        throw new Error('预览接口返回 ' + r.status + ': ' + errText);
                    }
                }

                // 渲染预览
                let html = '<div class="chunk-preview-list">';
                html += '<div class="cpl-doc">';
                html += '<div class="cpl-doc-title">📄 ' + esc(doc?.name || '文档') + '<span class="cpl-count">' + chunks.length + ' 个切片</span></div>';
                
                if (chunks.length === 0) {
                    html += '<div class="chunk-preview-empty" style="padding:20px;"><div class="cpe-text">暂无预览数据</div></div>';
                } else {
                    chunks.forEach(function(chunk, idx) {
                        const text = chunk.content || chunk.text || chunk;
                        const len = typeof text === 'string' ? text.length : 0;
                        html += '<div class="cpl-chunk">';
                        html += '<div class="cpl-chunk-header">chunk ' + (idx + 1) + '　字符数: ' + len + '</div>';
                        html += '<div class="cpl-chunk-content">';
                        html += esc(text).substring(0, 500);
                        if (typeof text === 'string' && text.length > 500) html += '...';
                        html += '</div>';
                        html += '</div>';
                    });
                }
                html += '</div>';
                html += '</div>';
                area.innerHTML = html;

            } catch(e) {
                area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">❌</div><div class="cpe-text">预览失败: ' + esc(e.message) + '</div></div>';
            }
        }

        function getSelectedCreateDocIdx() {
            for (let i = 0; i < pendingKBDocs.length; i++) {
                if (pendingKBDocs[i].selected) return i;
            }
            return -1;
        }

        document.addEventListener('DOMContentLoaded', function() {
            authToken = localStorage.getItem('authToken');
            var params = new URLSearchParams(window.location.search);
            var view = params.get('view');
            if (view === 'create') {
                showCreateView();
            } else {
                renderKnowledgeList();
            }
        });
    </script>
</body>
</html>
