        function updateEditDocMeta(field, val) {
            var doc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
            if (!doc) return;
            if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                try { val = JSON.parse('[' + val + ']'); } catch(e) { val = String(val).split(',').map(function(s){ return s.trim(); }).filter(Boolean); }
            } else {
                val = (field.indexOf('size') >= 0 || field.indexOf('overlap') >= 0) ? parseInt(val) : val;
            }
            doc[field] = val;
            refreshPreviewToggleState();
        }

        function updateEditRAGSetting(field, value) {
            var doc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
            if (!doc) return;
            if (!doc.rag_config) {
                doc.rag_config = { rag_retrieve_method: 'similarity', embedding_model_name: 'text-embedding-v4', rerank_model_setting: { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 }, rrf_setting: { vector_weight: 0.7, rrf_k: 60 } };
            }
            var rc = doc.rag_config;
            if (field === 'retrieval_mode') {
                rc.rag_retrieve_method = (value === 'hybrid') ? 'hybrid' : 'similarity';
                // 混合检索时显示RRF配置
                var rrfConfigEl = document.getElementById('editRagRRFConfig');
                if (rrfConfigEl) {
                    rrfConfigEl.style.display = (value === 'hybrid') ? '' : 'none';
                }
            } else if (field === 'embedding_model') {
                rc.embedding_model_name = value;
            } else if (field === 'rerank_model') {
                if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                rc.rerank_model_setting.rerank_model = value;
            } else if (field === 'rerank_top_k') {
                if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                rc.rerank_model_setting.rerank_top_k = parseInt(value) || 3;
            } else if (field === 'score_thresh') {
                if (!rc.score_thresh_setting) rc.score_thresh_setting = { enable: false, score: 0.5 };
                var fv = parseFloat(value);
                if (isNaN(fv) || fv < 0.01 || fv > 1.0) {
                    showToast('Score 阈值范围为 0.01 ~ 1.0');
                    var inp = document.getElementById('editRagScoreThresh');
                    if (inp) inp.value = rc.score_thresh_setting.score;
                    return;
                }
                rc.score_thresh_setting.score = fv;
            } else if (field === 'vector_weight') {
                if (!rc.rrf_setting) rc.rrf_setting = { vector_weight: 0.7, rrf_k: 60 };
                var vw = parseFloat(value);
                if (isNaN(vw) || vw < 0 || vw > 1) {
                    showToast('向量权重范围为 0 ~ 1');
                    var inp = document.getElementById('editRagVectorWeight');
                    if (inp) inp.value = rc.rrf_setting.vector_weight;
                    return;
                }
                rc.rrf_setting.vector_weight = vw;
            } else if (field === 'rrf_k') {
                if (!rc.rrf_setting) rc.rrf_setting = { vector_weight: 0.7, rrf_k: 60 };
                var rk = parseInt(value);
                if (isNaN(rk) || rk < 1 || rk > 200) {
                    showToast('RRF平滑系数范围为 1 ~ 200');
                    var inp = document.getElementById('editRagRRFK');
                    if (inp) inp.value = rc.rrf_setting.rrf_k;
                    return;
                }
                rc.rrf_setting.rrf_k = rk;
            } else {
                rc[field] = value;
            }
        }

        async function handleEditDocAdd(input) {
            var files = input.files;
            if (!files || !files.length) return;
            var file = files[0];
            var allowed = ['.pdf','.docx','.doc','.txt','.md','.xlsx','.xls','.csv','.pptx','.ppt','.html','.json'];
            var ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
            if (allowed.indexOf(ext) < 0) {
                showToast('不支持的文件格式：' + file.name);
                input.value = '';
                return;
            }
            var docObj = {
                id: 'new_' + Date.now(),
                name: file.name,
                size: file.size,
                configured: false,
                is_new: true,
                chunk_strategy: 'standard',
                chunk_size: "",
                chunk_overlap: "",
                separators: [],
                parent_chunk_size: "",
                parent_chunk_overlap: "",
                parent_separators: [],
                child_chunk_size: "",
                child_chunk_overlap: "",
                child_separators: [],
                rag_config: null,
                metadata_tags: {},
                is_csv: (ext === '.csv')
            };
            if (ext === '.xlsx' || ext === '.xls') {
                readExcelFile(file, function(workbook) {
                    docObj._excelWorkbook = workbook;
                    if (selectedEditDocId === docObj.id) {
                        var selDoc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
                        if (selDoc && selDoc.chunk_strategy === 'table' && workbook) {
                            populateMetadataSheetSelect('kbEdit', workbook);
                        }
                    }
                });
            } else if (ext === '.csv') {
                readCSVFile(file, function(headers) {
                    docObj._csvHeaders = headers;
                    if (selectedEditDocId === docObj.id) {
                        var selDoc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
                        if (selDoc && selDoc.chunk_strategy === 'table' && headers) {
                            populateMetadataColumnsForCSV('kbEdit', headers);
                        }
                    }
                });
            }
            editDocs.push(docObj);
            selectedEditDocId = docObj.id;
            showToast('文档已上传，请设置切片策略');
            renderKnowledgeDetail(currentKbId, 'edit');
            input.value = '';
        }

        function replaceEditDoc(docId) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.docx,.doc,.txt,.md,.xlsx,.xls,.csv,.pptx,.ppt,.html,.json';
            input.onchange = async function() {
                if (!input.files || !input.files[0]) return;
                var fd = new FormData();
                fd.append('file', input.files[0]);
                try {
                    var url = '/api/knowledge/' + encodeURIComponent(currentKbId) + '/documents/' + encodeURIComponent(docId);
                    var r = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Bearer ' + authToken
                            // 注意：使用 FormData 时，不要手动设置 Content-Type: multipart/form-data
                            // 浏览器会自动设置并带上 boundary，手动设置反而会导致后端解析失败
                        },
                        body: fd
                    });
                    if (!r.ok) throw new Error('替换失败');
                    var doc = editDocs.find(function(d) { return d.id === docId; });
                    if (doc) {
                        doc.name = input.files[0].name;
                        doc.size = input.files[0].size;
                        doc.configured = false;
                        doc.is_new = true;
                        var ext = '.' + (input.files[0].name.split('.').pop() || '').toLowerCase();
                        doc.is_csv = (ext === '.csv');
                        if (ext === '.xlsx' || ext === '.xls') {
                            readExcelFile(input.files[0], function(workbook) {
                                doc._excelWorkbook = workbook;
                            });
                        } else if (ext === '.csv') {
                            readCSVFile(input.files[0], function(headers) {
                                doc._csvHeaders = headers;
                            });
                        }
                    }
                    showToast('文档已替换，请重新设置切片策略');
                    renderKnowledgeDetail(currentKbId, 'edit');
                } catch(e) { showToast(e.message || '替换失败'); }
            };
            input.click();
        }

        async function deleteEditDoc(docId) {
            if (!await showConfirm({ message: '确定删除该文档？', icon: 'warning', confirmText: '删除', type: 'danger' })) return;
            try {
                var r = await fetch('/api/knowledge/documents/' + encodeURIComponent(docId) + '?kb_id=' + encodeURIComponent(currentKbId), {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('删除失败');
                editDocs = editDocs.filter(function(d) { return d.id !== docId; });
                if (selectedEditDocId === docId) {
                    selectedEditDocId = editDocs.length > 0 ? editDocs[0].id : null;
                }
                showToast('文档已删除');
                renderKnowledgeDetail(currentKbId, 'edit');
            } catch(e) { showToast(e.message || '删除失败'); }
        }

        async function saveEditDocSettings() {
            var doc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
            if (!doc) { showToast('请先选择一个文档'); return; }

            var cs = doc.chunk_strategy || 'standard';
            var isEmpty = function(v) { return v === null || v === undefined || v === '' || (Array.isArray(v) && v.length === 0); };
            if (cs === 'parent_child') {
                if (isEmpty(doc.parent_chunk_size) || isEmpty(doc.parent_chunk_overlap) || isEmpty(doc.parent_separators)) {
                    showToast('父段设置：请填写 Chunk最大长度、Chunk重叠长度、分隔符列表'); return;
                }
                if (isEmpty(doc.child_chunk_size) || isEmpty(doc.child_chunk_overlap) || isEmpty(doc.child_separators)) {
                    showToast('子段设置：请填写 Chunk最大长度、Chunk重叠长度、分隔符列表'); return;
                }
            } else if (cs === 'standard') {
                if (isEmpty(doc.chunk_size) || isEmpty(doc.chunk_overlap) || isEmpty(doc.separators)) {
                    showToast('标准分段：请填写 Chunk最大长度、Chunk重叠长度、分隔符列表'); return;
                }
            }

            var kbNameEl = document.getElementById('kbEditName');
            var kbDescEl = document.getElementById('kbEditDesc');
            var kbName = kbNameEl ? kbNameEl.value.trim() : '';
            var kbDesc = kbDescEl ? kbDescEl.value.trim() : '';
            if (!kbName) {
                showToast('知识库名称不能为空');
                return;
            }

            var btn = document.getElementById('settingsBtn');
            if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }

            // 显示进度条
            showSaveProgressDialog();

            try {
                var body = {
                    chunk_strategy: doc.chunk_strategy,
                    chunk_size: doc.chunk_size,
                    chunk_overlap: doc.chunk_overlap,
                    separators: doc.separators,
                    parent_chunk_size: doc.parent_chunk_size,
                    parent_chunk_overlap: doc.parent_chunk_overlap,
                    parent_separators: doc.parent_separators,
                    child_chunk_size: doc.child_chunk_size,
                    child_chunk_overlap: doc.child_chunk_overlap,
                    child_separators: doc.child_separators,
                    rag_config: doc.rag_config,
                    rrf_setting: doc.rrf_setting,
                    metadata_tags: doc.metadata_tags || {},
                    name: kbName,
                    description: kbDesc
                };
                
                // 更新进度：保存设置中
                updateSaveProgress(20, '正在保存设置...');
                
                var r = await fetch('/api/knowledge/documents/' + encodeURIComponent(doc.id) + '?kb_id=' + encodeURIComponent(currentKbId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify(body)
                });
                if (!r.ok) throw new Error('保存失败');
                
                // 更新进度：处理文档中
                updateSaveProgress(50, '正在处理文档...');
                
                justSavedDoc = {
                    id: doc.id,
                    chunk_strategy: doc.chunk_strategy,
                    chunk_size: doc.chunk_size,
                    chunk_overlap: doc.chunk_overlap,
                    separators: doc.separators,
                    parent_chunk_size: doc.parent_chunk_size,
                    parent_chunk_overlap: doc.parent_chunk_overlap,
                    parent_separators: doc.parent_separators,
                    child_chunk_size: doc.child_chunk_size,
                    child_chunk_overlap: doc.child_chunk_overlap,
                    child_separators: doc.child_separators,
                    rag_config: doc.rag_config
                };
                
                // 更新进度：向量化中
                updateSaveProgress(80, '正在向量化...');
                
                // 等待一段时间让后台任务完成（实际向量化在后台执行）
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // 更新进度：完成
                updateSaveProgress(100, '保存完成');
                
                showToast('✅ 设置保存成功');
                
                // 关闭进度条
                setTimeout(function() {
                    hideSaveProgressDialog();
                    if (btn) { btn.disabled = false; btn.textContent = '⚙️ 设置'; }
                    // 后台异步刷新页面
                    renderKnowledgeDetail(currentKbId, 'edit');
                }, 500);
            } catch(e) {
                hideSaveProgressDialog();
                showToast(' 设置保存失败：' + (e.message || '未知错误'));
                if (btn) { btn.disabled = false; btn.textContent = '⚙️ 设置'; }
            }
        }

        // 进度条相关函数
        function showSaveProgressDialog() {
            // 移除已存在的进度条
            var existing = document.getElementById('saveProgressDialog');
            if (existing) existing.remove();

            var dialog = document.createElement('div');
            dialog.id = 'saveProgressDialog';
            dialog.className = 'save-progress-dialog';
            dialog.innerHTML =
                '<div class="save-progress-overlay"></div>' +
                '<div class="save-progress-content">' +
                    '<div class="save-progress-title">💾 保存知识库设置</div>' +
                    '<div class="save-progress-bar-container">' +
                        '<div class="save-progress-bar" id="saveProgressBar" style="width: 0%"></div>' +
                    '</div>' +
                    '<div class="save-progress-text" id="saveProgressText">正在保存设置...</div>' +
                '</div>';
            
            document.body.appendChild(dialog);
        }

        function updateSaveProgress(percent, text) {
            var bar = document.getElementById('saveProgressBar');
            var textEl = document.getElementById('saveProgressText');
            if (bar) bar.style.width = percent + '%';
            if (textEl) textEl.textContent = text;
        }

            var dialog = document.getElementById('saveProgressDialog');
            if (dialog) dialog.remove();
        }

        function _recallHistoryKey() {
            return 'recall_history_all_' + (currentKbId || 'all');
        }

        function _loadRecallHistory() {
            try {
                var raw = localStorage.getItem(_recallHistoryKey());
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }

        function _saveRecallHistory(list) {
            try { localStorage.setItem(_recallHistoryKey(), JSON.stringify(list.slice(-20))); } catch(e) {}
        }

        async function renderKnowledgeDetail(kbId, mode) {
            var area = document.getElementById('kbDetailArea');
            if (!area) return;
            if (!mode) mode = 'edit';

            area.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">加载中...</div>';

            try {
                var docs = [];
                if (mode !== 'create') {
                    var r = await fetch('/api/knowledge/documents?kb_id=' + encodeURIComponent(kbId), {
                        headers: { 'Authorization': 'Bearer ' + authToken }
                    });
                    var data = await r.json();
                    docs = data.documents || [];
                    // 保存旧文档的策略，用于未配置文档的策略继承
                    var oldDocStrategies = {};
                    editDocs.forEach(function(d) {
                        if (!d.configured && d.chunk_strategy && d.chunk_strategy !== 'standard') {
                            oldDocStrategies[d.id] = d.chunk_strategy;
                        }
                    });
                    // 如果有待应用的策略（来自 toggleSelectEditDoc），用于新选中的未配置文档
                    var targetStrategy = _pendingEditStrategy;
                    _pendingEditStrategy = null;
                    editDocs = docs.map(function(d) {
                        var cs = d.chunk_strategy || 'standard';
                        // 未配置的文档，优先继承之前本地设置的策略
                        if (!d.configured) {
                            if (oldDocStrategies[d.id]) {
                                cs = oldDocStrategies[d.id];
                            } else if (d.id === selectedEditDocId && targetStrategy) {
                                cs = targetStrategy;
                            }
                        }
                        return {
                            id: d.id,
                            name: d.name || d.filename || '文档',
                            filename: d.filename || d.name || d.id,
                            size: d.size || 0,
                            configured: d.configured === true,
                            is_new: false,
                            on_disk: d.on_disk,
                            chunk_strategy: cs,
                            chunk_size: d.chunk_size || "",
                            chunk_overlap: d.chunk_overlap || "",
                            separators: d.separators || [],
                            parent_chunk_size: d.parent_chunk_size || "",
                            parent_chunk_overlap: d.parent_chunk_overlap || "",
                            parent_separators: d.parent_separators || [],
                            child_chunk_size: d.child_chunk_size || "",
                            child_chunk_overlap: d.child_chunk_overlap || "",
                            child_separators: d.child_separators || [],
                            rag_config: (function() {
                                var rc = d.rag_config || null;
                                if (rc && !rc.rrf_setting) {
                                    rc.rrf_setting = { vector_weight: 0.7, rrf_k: 60 };
                                }
                                return rc;
                            })(),
                            metadata_tags: d.metadata_tags || {}
                        };
                    });
                    editDocs.forEach(function(doc) {
                        if (doc.chunk_strategy === 'table') {
                            var ext = '.' + (doc.name.split('.').pop() || '').toLowerCase();
                            if (ext === '.xlsx' || ext === '.xls' || ext === '.csv') {
                                fetch('/api/knowledge/files/' + encodeURIComponent(kbId) + '/' + encodeURIComponent(doc.name) + '?token=' + encodeURIComponent(authToken), {
                                    headers: { 'Authorization': 'Bearer ' + authToken }
                                }).then(function(resp) {
                                    if (!resp.ok) return null;
                                    return resp.blob();
                                }).then(function(blob) {
                                    if (!blob) return;
                                    var file = new File([blob], doc.name, { type: blob.type });
                                    if (ext === '.xlsx' || ext === '.xls') {
                                        readExcelFile(file, function(wb) {
                                            doc._excelWorkbook = wb;
                                            if (selectedEditDocId === doc.id) {
                                                setTimeout(function() { populateMetadataSheetSelect('kbEdit', wb); }, 50);
                                            }
                                        });
                                    } else {
                                        readCSVFile(file, function(headers) {
                                            doc._csvHeaders = headers;
                                            if (selectedEditDocId === doc.id) {
                                                setTimeout(function() { populateMetadataColumnsForCSV('kbEdit', headers); }, 50);
                                            }
                                        });
                                    }
                                }).catch(function() {});
                            }
                        }
                    });
                    var existingIds = editDocs.map(function(d) { return d.id; });
                    if (justSavedDoc) {
                        var savedDoc = editDocs.find(function(d) { return d.id === justSavedDoc.id; });
                        if (savedDoc) {
                            savedDoc.configured = true;
                            savedDoc.chunk_strategy = justSavedDoc.chunk_strategy;
                            savedDoc.chunk_size = justSavedDoc.chunk_size;
                            savedDoc.chunk_overlap = justSavedDoc.chunk_overlap;
                            savedDoc.separators = justSavedDoc.separators;
                            savedDoc.parent_chunk_size = justSavedDoc.parent_chunk_size;
                            savedDoc.parent_chunk_overlap = justSavedDoc.parent_chunk_overlap;
                            savedDoc.parent_separators = justSavedDoc.parent_separators;
                            savedDoc.child_chunk_size = justSavedDoc.child_chunk_size;
                            savedDoc.child_chunk_overlap = justSavedDoc.child_chunk_overlap;
                            savedDoc.child_separators = justSavedDoc.child_separators;
                            savedDoc.rag_config = justSavedDoc.rag_config;
                        }
                        justSavedDoc = null;
                    }
                    if (selectedEditDocId && existingIds.indexOf(selectedEditDocId) === -1) {
                        selectedEditDocId = editDocs.length > 0 ? editDocs[0].id : null;
                    } else if (!selectedEditDocId && !editDetailLoaded && editDocs.length > 0) {
                        selectedEditDocId = editDocs[0].id;

                var kbData = null;

                if (isPendingCreate && pendingKBCreate) {
                    kbData = {

        async function updateKBMeta(field, val) {
            if (!currentKbId || currentKbId === 'pending') {
                if (pendingKBCreate) {
                    if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                        try {
                            val = JSON.parse('[' + val + ']');
                        } catch(e) {
                            val = String(val).split(',').map(function(s){ return s.trim(); }).filter(Boolean);
                        }
                    } else {
                        val = (field.indexOf('size') >= 0 || field.indexOf('overlap') >= 0) ? parseInt(val) : val;
                    }
                    pendingKBCreate[field] = val;
                    // 同步到当前选中的 doc
                    var sDoc = pendingKBDocs.find(function(d) { return d.selected; });
                    if (sDoc) sDoc[field] = val;
                    refreshPreviewToggleState();
                }
                return;
            }
            if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                try { val = JSON.parse('[' + val + ']'); } catch(e) { val = String(val).split(',').map(function(s){ return s.trim(); }).filter(Boolean); }
            } else {
                val = (field.indexOf('size') >= 0 || field.indexOf('overlap') >= 0) ? parseInt(val) : val;
            }
            try {
                var qs = new URLSearchParams();
                if (field === 'separators' || field === 'parent_separators' || field === 'child_separators') {
                    qs.append(field, JSON.stringify(val));
                } else {
                    qs.append(field, val);
                }
                var r = await fetch('/api/knowledge/bases/' + encodeURIComponent(currentKbId) + '?' + qs.toString(), {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('更新失败');
                showToast('已更新');
            } catch(e) { showToast(e.message || '更新失败'); }
        }

        async function doRecallTest() {
            var queryEl = document.getElementById('kbRecallQuery');
            if (!queryEl) return;
            var query = queryEl.innerText.trim();
            if (!query) { showToast('请输入测试文本'); return; }
            var resultEl = document.getElementById('kbRecallResult');
            var statusEl = document.getElementById('kbRecallStatus');
            resultEl.innerHTML = '<div style="text-align:center;padding:40px;color:#999;"><div class="spinner-small"></div><div style="margin-top:8px;font-size:0.82rem;">测试中...</div></div>';
            statusEl.textContent = '测试中';
            try {
                var params = new URLSearchParams();
                params.append('query', query);
                params.append('kb_id', currentKbId);
                params.append('top_k', 10);
                var r = await fetch('/api/knowledge/retrieve?' + params.toString(), {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!r.ok) throw new Error('召回失败');
                var data = await r.json();
                var chunks = data.chunks || data.results || [];
                statusEl.textContent = chunks.length + ' 条结果';
                if (chunks.length === 0) {
                    resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;font-size:0.85rem;">未召回相关片段</div>';
                } else {
                    var html = '';
                    chunks.forEach(function(chunk, idx) {
                        var rank = idx + 1;
                        var score = chunk.score != null ? (typeof chunk.score === 'number' ? chunk.score.toFixed(4) : chunk.score) : '';
                        var content = chunk.content || chunk.text || '';
                        var source = chunk.source || chunk.filename || chunk.doc_name || '';
                        html += '<div class="rr-item">';
                        html += '<div class="rr-head"><div class="rr-rank-score"><div class="rr-rank ' + (rank <= 3 ? 'top' + rank : '') + '">' + rank + '</div>' + (score ? '<span class="rr-score">' + score + '</span>' : '') + '</div><span class="rr-source" title="' + esc(source) + '">' + esc(source) + '</span></div>';
                        html += '<div class="rr-content">' + esc(content) + '</div>';
                        html += '</div>';
                    });
                    resultEl.innerHTML = html;
                }
                var history = _loadRecallHistory();
                history.unshift(query);
                _saveRecallHistory(history);
                renderRecallHistory();
            } catch(e) {
                statusEl.textContent = '测试失败';
                resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ff4757;font-size:0.85rem;">召回失败：' + e.message + '</div>';
            }
        }

        function refreshPreviewToggleState() {
            const toggle = document.getElementById('previewChunkToggle');
            const label = toggle ? toggle.closest('label') : null;
            if (!toggle) return;
            var isEditMode = (currentDetailMode === 'edit' && currentKbId && currentKbId !== 'pending');
            var prefix = isEditMode ? 'kbEdit' : 'kbCreate';
            var strategy;
            if (isEditMode) {
                var selDoc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
                strategy = selDoc ? (selDoc.chunk_strategy || 'standard') : 'standard';
            } else {
                strategy = pendingKBCreate ? (pendingKBCreate.chunk_strategy || 'standard') : 'standard';
            }
            let allFilled = true;
            const getVal = function(id) {
                const el = document.getElementById(id);
                return el ? String(el.value).trim() : '';
            };
            if (strategy === 'parent_child') {
                allFilled = getVal(prefix + 'ParentChunkSize') !== '' &&
                            getVal(prefix + 'ParentChunkOverlap') !== '' &&
                            getVal(prefix + 'ParentSeparators') !== '' &&
                            getVal(prefix + 'ChildChunkSize') !== '' &&
                            getVal(prefix + 'ChildChunkOverlap') !== '' &&
                            getVal(prefix + 'ChildSeparators') !== '';
            } else if (strategy === 'qa') {
                allFilled = true;
            } else if (strategy === 'table') {
                // 表格切片模式：只要有选中的文档就可以预览
                var selectedDoc = isEditMode ? 
                    editDocs.find(function(d) { return d.id === selectedEditDocId; }) :
                    pendingKBDocs.find(function(d) { return d.selected; });
                allFilled = !!selectedDoc;
            } else {
                allFilled = getVal(prefix + 'ChunkSize') !== '' &&
                            getVal(prefix + 'ChunkOverlap') !== '' &&
                            getVal(prefix + 'Separators') !== '';
            }
            toggle.disabled = !allFilled;
            if (label) {
                if (!allFilled) label.classList.add('preview-disabled');
                else label.classList.remove('preview-disabled');
            }
            if (!allFilled && toggle.checked) {
                toggle.checked = false;
                toggleChunkPreview(false);
            }
        }

        function onScoreThreshToggle(prefix) {
            var isCreate = (prefix === 'create');
            var toggleEl = document.getElementById(isCreate ? 'ragScoreThreshToggle' : 'editRagScoreThreshToggle');
            var wrapEl = document.getElementById(isCreate ? 'ragScoreThreshInputWrap' : 'editRagScoreThreshInputWrap');
            var enabled = toggleEl && toggleEl.classList.contains('on');
            if (enabled) {
                toggleEl.classList.remove('on');
                if (wrapEl) wrapEl.classList.remove('show');
            } else {
                toggleEl.classList.add('on');
                if (wrapEl) wrapEl.classList.add('show');
            }
            var newEnabled = !enabled;
            // 从输入框读取当前分数值
            var inputEl = document.getElementById(isCreate ? 'ragScoreThresh' : 'editRagScoreThresh');
            var currentScore = inputEl ? parseFloat(inputEl.value) : 0.5;
            if (isNaN(currentScore) || currentScore < 0.01 || currentScore > 1.0) currentScore = 0.5;

            if (isCreate && pendingKBCreate) {
                if (!pendingKBCreate.rag_config) pendingKBCreate.rag_config = {};
                if (!pendingKBCreate.rag_config.score_thresh_setting) {
                    pendingKBCreate.rag_config.score_thresh_setting = { enable: false, score: 0.5 };
                }
                pendingKBCreate.rag_config.score_thresh_setting.enable = newEnabled;
                pendingKBCreate.rag_config.score_thresh_setting.score = currentScore;
            } else if (!isCreate) {
                var doc = editDocs.find(function(d) { return d.id === selectedEditDocId; });
                if (doc) {
                    if (!doc.rag_config) doc.rag_config = {};
                    if (!doc.rag_config.score_thresh_setting) {
                        doc.rag_config.score_thresh_setting = { enable: false, score: 0.5 };
                    }
                    doc.rag_config.score_thresh_setting.enable = newEnabled;
                    doc.rag_config.score_thresh_setting.score = currentScore;
                }

        function updateRAGSetting(field, value) {
            if (pendingKBCreate) {
                if (!pendingKBCreate.rag_config) pendingKBCreate.rag_config = {};
                var rc = pendingKBCreate.rag_config;
                if (field === 'retrieval_mode') {
                    rc.rag_retrieve_method = (value === 'hybrid') ? 'hybrid' : 'similarity';
                } else if (field === 'embedding_model') {
                    rc.embedding_model_name = value;
                } else if (field === 'rerank_model') {
                    if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                    rc.rerank_model_setting.rerank_model = value;
                } else if (field === 'rerank_top_k') {
                    if (!rc.rerank_model_setting) rc.rerank_model_setting = { rerank_enable: false, rerank_model: 'bge-reranker-large', rerank_top_k: 3 };
                    rc.rerank_model_setting.rerank_top_k = parseInt(value) || 3;
                } else if (field === 'score_thresh') {
                    if (!rc.score_thresh_setting) rc.score_thresh_setting = { enable: false, score: 0.5 };
                    var fv = parseFloat(value);
                    if (isNaN(fv) || fv < 0.01 || fv > 1.0) {
                        showToast('Score 阈值范围为 0.01 ~ 1.0');
                        var inp = document.getElementById('ragScoreThresh');
                        if (inp) inp.value = rc.score_thresh_setting.score;
                        return;
                    }
                    rc.score_thresh_setting.score = fv;
                } else if (field === 'vector_weight') {
                    if (!rc.rrf_setting) rc.rrf_setting = { vector_weight: 0.7, rrf_k: 60 };
                    var vw = parseFloat(value);
                    if (isNaN(vw) || vw < 0 || vw > 1) {
                        showToast('向量权重范围为 0 ~ 1');
                        var inp = document.getElementById('ragVectorWeight');
                        if (inp) inp.value = rc.rrf_setting.vector_weight;
                        return;
                    }
                    rc.rrf_setting.vector_weight = vw;
                } else if (field === 'rrf_k') {
                    if (!rc.rrf_setting) rc.rrf_setting = { vector_weight: 0.7, rrf_k: 60 };
                    var rk = parseInt(value);
                    if (isNaN(rk) || rk < 1 || rk > 200) {
                        showToast('RRF平滑系数范围为 1 ~ 200');
                        var inp = document.getElementById('ragRRFK');
                        if (inp) inp.value = rc.rrf_setting.rrf_k;
                        return;
                    }
                    rc.rrf_setting.rrf_k = rk;
                } else {
                    rc[field] = value;
                }
            }
        }

                doc = editDocs.find(function(d) { return d.id === selectedEditDocId; }) || null;
                if (!doc) {
                    area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">⚠️</div><div class="cpe-text">请先在左侧选择一个文档</div></div>';
                    return;
                }
                strategy = doc.chunk_strategy || 'standard';
                prefix = 'kbEdit';
                chunkParams = {
                    strategy: strategy,
                    chunk_size: parseInt(document.getElementById(prefix + 'ChunkSize')?.value) || doc.chunk_size || 800,
                    chunk_overlap: parseInt(document.getElementById(prefix + 'ChunkOverlap')?.value) || doc.chunk_overlap || 150,
                    separators: doc.separators || ['\n\n','\n','。','；','，',' ',''],
                    parent_chunk_size: parseInt(document.getElementById(prefix + 'ParentChunkSize')?.value) || doc.parent_chunk_size || 1600,
                    parent_chunk_overlap: parseInt(document.getElementById(prefix + 'ParentChunkOverlap')?.value) || doc.parent_chunk_overlap || 300,
                    parent_separators: doc.parent_separators || doc.separators || ['\n\n','\n','。','；','，',' ',''],
                    child_chunk_size: parseInt(document.getElementById(prefix + 'ChildChunkSize')?.value) || doc.child_chunk_size || 800,
                    child_chunk_overlap: parseInt(document.getElementById(prefix + 'ChildChunkOverlap')?.value) || doc.child_chunk_overlap || 150,
                    child_separators: doc.child_separators || doc.separators || ['\n\n','\n','。','；','，',' ','']
                };
            } else {
                const selectedIdx = getSelectedCreateDocIdx();
                if (selectedIdx === -1) {
                    area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">⚠️</div><div class="cpe-text">请先在左侧选择一个文档</div></div>';
                    return;
                }
                doc = pendingKBDocs[selectedIdx];
                strategy = pendingKBCreate ? (pendingKBCreate.chunk_strategy || 'standard') : 'standard';
                prefix = 'kbCreate';
                chunkParams = {
                    strategy: strategy,
                    chunk_size: parseInt(document.getElementById(prefix + 'ChunkSize')?.value) || 800,
                    chunk_overlap: parseInt(document.getElementById(prefix + 'ChunkOverlap')?.value) || 150,
                    separators: (pendingKBCreate?.separators || ['\n\n','\n','。','；','，',' ','']),
                    parent_chunk_size: parseInt(document.getElementById(prefix + 'ParentChunkSize')?.value) || 1600,
                    parent_chunk_overlap: parseInt(document.getElementById(prefix + 'ParentChunkOverlap')?.value) || 300,
                    parent_separators: (pendingKBCreate?.parent_separators || pendingKBCreate?.separators || ['\n\n','\n','。','；','，',' ','']),
                    child_chunk_size: parseInt(document.getElementById(prefix + 'ChildChunkSize')?.value) || 800,
                    child_chunk_overlap: parseInt(document.getElementById(prefix + 'ChildChunkOverlap')?.value) || 150,
                    child_separators: (pendingKBCreate?.child_separators || pendingKBCreate?.separators || ['\n\n','\n','。','；','，',' ',''])
                };
            }

            // 显示加载中
            area.innerHTML = '<div class="chunk-preview-empty"><div class="spinner-small"></div><div class="cpe-text" style="margin-top:10px;">正在生成预览...</div></div>';

            try {
                let chunks = [];
                if (doc && doc.file) {
                    const formData = new FormData();
                    formData.append('file', doc.file);
                    const qs = new URLSearchParams();
                    qs.append('chunk_strategy', strategy);
                    qs.append('chunk_size', chunkParams.chunk_size);
                    qs.append('chunk_overlap', chunkParams.chunk_overlap);
                    if (chunkParams.separators) qs.append('separators', JSON.stringify(chunkParams.separators));
                    if (strategy === 'parent_child') {
                        qs.append('parent_chunk_size', chunkParams.parent_chunk_size);
                        qs.append('parent_chunk_overlap', chunkParams.parent_chunk_overlap);
                        if (chunkParams.parent_separators) qs.append('parent_separators', JSON.stringify(chunkParams.parent_separators));
                        qs.append('child_chunk_size', chunkParams.child_chunk_size);
                        qs.append('child_chunk_overlap', chunkParams.child_chunk_overlap);
                        if (chunkParams.child_separators) qs.append('child_separators', JSON.stringify(chunkParams.child_separators));
                    }
                    
                    // 表格切片模式：收集元数据标签
                    if (strategy === 'table' && doc.metadata_tags) {
                        // 判断是Excel还是CSV
                        var ext = '.' + (doc.name.split('.').pop() || '').toLowerCase();
                        if (ext === '.csv') {
                            // CSV：使用 _csv_default
                            var csvTags = doc.metadata_tags['_csv_default'] || {};
                            var checkedCols = Object.keys(csvTags).filter(function(k) { return csvTags[k]; });
                            if (checkedCols.length > 0) {
                                qs.append('metadata_tags', JSON.stringify(['source'].concat(checkedCols)));
                            }
                        } else {
                            // Excel：使用当前选中的sheet
                            var sheetSelect = document.getElementById('kbCreateMetadataSheetSelect');
                            var selectedSheet = sheetSelect ? sheetSelect.value : '';
                            if (selectedSheet && doc.metadata_tags[selectedSheet]) {
                                var sheetTags = doc.metadata_tags[selectedSheet] || {};
                                var checkedCols = Object.keys(sheetTags).filter(function(k) { return sheetTags[k]; });
                                if (checkedCols.length > 0) {
                                    qs.append('metadata_tags', JSON.stringify(['source', 'sheet'].concat(checkedCols)));
                                }
                            }
                        }
                    }

                    const r = await fetch('/api/knowledge/chunk_preview?' + qs.toString(), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: formData
                    });
                    if (r.ok) {
                        const data = await r.json();
                        chunks = data.chunks || [];
                    } else {
                        const errText = await r.text();
                        throw new Error('预览接口返回 ' + r.status + ': ' + errText);
                    }
                } else if (isEditMode && doc && doc.id) {
                    if (doc.on_disk === false || doc.on_disk === 'false') {
                        throw new Error('源文件不在磁盘，请先点击"替换"按钮重新上传该文档后再预览');
                    }
                    // 优化：直接使用磁盘预览接口，避免下载-上传的网络开销
                    const qs2 = new URLSearchParams();
                    qs2.append('kb_id', currentKbId);
                    qs2.append('filename', doc.filename || doc.id);
                    qs2.append('chunk_strategy', strategy);
                    qs2.append('chunk_size', chunkParams.chunk_size);
                    qs2.append('chunk_overlap', chunkParams.chunk_overlap);
                    if (chunkParams.separators) qs2.append('separators', JSON.stringify(chunkParams.separators));
                    if (strategy === 'parent_child') {
                        qs2.append('parent_chunk_size', chunkParams.parent_chunk_size);
                        qs2.append('parent_chunk_overlap', chunkParams.parent_chunk_overlap);
                        if (chunkParams.parent_separators) qs2.append('parent_separators', JSON.stringify(chunkParams.parent_separators));
                        qs2.append('child_chunk_size', chunkParams.child_chunk_size);
                        qs2.append('child_chunk_overlap', chunkParams.child_chunk_overlap);
                        if (chunkParams.child_separators) qs2.append('child_separators', JSON.stringify(chunkParams.child_separators));
                    }
                    
                    // 表格切片模式：收集元数据标签
                    if (strategy === 'table' && doc.metadata_tags) {
                        var ext = '.' + ((doc.filename || doc.name || '').split('.').pop() || '').toLowerCase();
                        if (ext === '.csv') {
                            var csvTags = doc.metadata_tags['_csv_default'] || {};
                            var checkedCols = Object.keys(csvTags).filter(function(k) { return csvTags[k]; });
                            if (checkedCols.length > 0) {
                                qs2.append('metadata_tags', JSON.stringify(['source'].concat(checkedCols)));
                            }
                        } else {
                            var sheetSelect = document.getElementById('kbEditMetadataSheetSelect');
                            var selectedSheet = sheetSelect ? sheetSelect.value : '';
                            if (selectedSheet && doc.metadata_tags[selectedSheet]) {
                                var sheetTags = doc.metadata_tags[selectedSheet] || {};
                                var checkedCols = Object.keys(sheetTags).filter(function(k) { return sheetTags[k]; });
                                if (checkedCols.length > 0) {
                                    qs2.append('metadata_tags', JSON.stringify(['source', 'sheet'].concat(checkedCols)));
                                }
                            }
                        }
                    }
                    
                    const r = await fetch('/api/knowledge/chunk_preview_from_disk?' + qs2.toString(), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken }
                    });
                    if (r.ok) {
                        const data = await r.json();
                        chunks = data.chunks || [];
                    } else {
                        const errText = await r.text();
                        throw new Error('预览接口返回 ' + r.status + ': ' + errText);
                    }
                }

                // 渲染预览
                let html = '<div class="chunk-preview-list">';
                html += '<div class="cpl-doc">';
                html += '<div class="cpl-doc-title">📄 ' + esc(doc?.name || '文档') + '<span class="cpl-count">' + chunks.length + ' 个切片</span></div>';
                
                if (chunks.length === 0) {
                    html += '<div class="chunk-preview-empty" style="padding:20px;"><div class="cpe-text">暂无预览数据</div></div>';
                } else {
                    chunks.forEach(function(chunk, idx) {
                        const text = chunk.content || chunk.text || chunk;
                        const len = typeof text === 'string' ? text.length : 0;
                        html += '<div class="cpl-chunk">';
                        html += '<div class="cpl-chunk-header">chunk ' + (idx + 1) + '　字符数: ' + len + '</div>';
                        html += '<div class="cpl-chunk-content">';
                        html += esc(text).substring(0, 500);
                        if (typeof text === 'string' && text.length > 500) html += '...';
                        html += '</div>';
                        html += '</div>';
                    });
                }
                html += '</div>';
                html += '</div>';
                area.innerHTML = html;

            } catch(e) {
                area.innerHTML = '<div class="chunk-preview-empty"><div class="cpe-icon">❌</div><div class="cpe-text">预览失败: ' + esc(e.message) + '</div></div>';
            }
        }

        function getSelectedCreateDocIdx() {
            for (let i = 0; i < pendingKBDocs.length; i++) {
                if (pendingKBDocs[i].selected) return i;
            }
            return -1;
        }

        document.addEventListener('DOMContentLoaded', function() {
            authToken = localStorage.getItem('authToken');
            var params = new URLSearchParams(window.location.search);
            var view = params.get('view');
            if (view === 'create') {
                showCreateView();
            } else {
                renderKnowledgeList();
            }
        });
    </script>
</body>
</html>
