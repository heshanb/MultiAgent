<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智商店 - 小智</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f7f8fa; min-height: 100vh; }
        
        .page-header {
            background: white;
            border-bottom: 1px solid #e8e8e8;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .page-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            color: #666;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .back-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: #f5f3ff;
        }
        
        .back-btn svg {
            width: 16px;
            height: 16px;
        }
        
        .page-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }
        
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .store-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        
        .store-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            border-color: rgba(102,126,234,0.2);
        }
        
        .store-card-header {
            padding: 24px 24px 16px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        
        .store-card-avatar {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(102,126,234,0.25);
        }
        
        .store-card-info {
            flex: 1;
            min-width: 0;
        }
        
        .store-card-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        
        .store-card-desc {
            font-size: 0.85rem;
            color: #999;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .store-card-footer {
            padding: 16px 24px;
            border-top: 1px solid #f0f1f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .store-card-tags {
            display: flex;
            gap: 6px;
        }
        
        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: #f5f6f8;
            color: #666;
        }
        
        .tag.hot {
            background: #fff2e8;
            color: #fa8c16;
        }
        
        .store-card-action {
            padding: 6px 16px;
            border-radius: 16px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .store-card-action:hover {
            background: #667eea;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }
        
        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state .empty-text {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="page-header-left">
            <a href="/products/online" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                返回
            </a>
            <h1 class="page-title">小智商店</h1>
        </div>
    </div>
    
    <div class="container">
        <div class="store-grid">
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">📝</div>
                    <div class="store-card-info">
                        <div class="store-card-name">文档助手</div>
                        <div class="store-card-desc">智能文档处理助手，支持格式转换、内容提取、摘要生成等功能</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag hot">热门</span>
                        <span class="tag">文档</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
            
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">💻</div>
                    <div class="store-card-info">
                        <div class="store-card-name">代码助手</div>
                        <div class="store-card-desc">AI 编程助手，支持代码生成、调试、优化和代码审查</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag hot">热门</span>
                        <span class="tag">编程</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
            
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">🎨</div>
                    <div class="store-card-info">
                        <div class="store-card-name">设计助手</div>
                        <div class="store-card-desc">智能设计工具，支持 UI 设计、配色方案、图标生成等</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag">设计</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
            
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">📊</div>
                    <div class="store-card-info">
                        <div class="store-card-name">数据分析</div>
                        <div class="store-card-desc">智能数据分析助手，支持数据可视化、趋势分析、报告生成</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag">数据</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
            
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">🌐</div>
                    <div class="store-card-info">
                        <div class="store-card-name">翻译助手</div>
                        <div class="store-card-desc">多语言智能翻译，支持文档翻译、实时翻译、专业术语翻译</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag">翻译</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
            
            <div class="store-card">
                <div class="store-card-header">
                    <div class="store-card-avatar">📧</div>
                    <div class="store-card-info">
                        <div class="store-card-name">邮件助手</div>
                        <div class="store-card-desc">智能邮件撰写、回复建议、邮件分类和优先级管理</div>
                    </div>
                </div>
                <div class="store-card-footer">
                    <div class="store-card-tags">
                        <span class="tag">办公</span>
                    </div>
                    <button class="store-card-action">使用</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
