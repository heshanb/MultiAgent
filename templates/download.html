<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智 - 下载中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            color: white;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .version-section {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .version-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .version-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            color: white;
            font-size: 28px;
        }

        .version-info h2 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .version-info .version-number {
            color: #666;
            font-size: 16px;
        }

        .version-info .release-date {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }

        .download-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .download-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .download-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .download-card.primary {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .download-card.primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .download-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .download-card .file-info {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-card.primary .download-btn {
            background: white;
            color: #667eea;
        }

        .download-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .download-card.primary .download-btn:hover {
            background: #f0f0f0;
        }

        .features {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .features h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .feature-item .icon {
            width: 24px;
            height: 24px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .system-requirements {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .system-requirements h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .requirements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .requirement-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .requirement-item label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .requirement-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding: 20px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .version-section {
                padding: 25px;
            }

            .download-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖</div>
            <h1>小智 AI 助手</h1>
            <p>智能、高效、专业的 AI 办公助手</p>
        </div>

        <div class="version-section">
            <div class="version-header">
                <div class="version-icon">📦</div>
                <div class="version-info">
                    <h2><span data-release="display_name">Sageon</span></h2>
                    <div class="version-number">版本 <span data-release="version">-</span></div>
                    <div class="release-date">发布日期：<span data-release="release_date">-</span></div>
                </div>
            </div>

            <div class="download-options">
                <div class="download-card primary" data-download-key="windows-x64">
                    <h3>Windows <span data-release-arch="windows-x64">64 bit</span></h3>
                    <div class="file-info" data-release-filename="windows-x64">安装包 (.exe)</div>
                    <button class="download-btn">立即下载</button>
                </div>
            </div>

            <div class="features">
                <h3>✨ 主要功能</h3>
                <div class="feature-list">
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>智能文档处理</span>
                    </div>
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>AI 代码助手</span>
                    </div>
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>图纸识别助手</span>
                    </div>
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>知识库管理</span>
                    </div>
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>智能体管理</span>
                    </div>
                    <div class="feature-item">
                        <div class="icon">✓</div>
                        <span>离线可用</span>
                    </div>
                </div>
            </div>

            <div class="system-requirements">
                <h3>💻 系统要求</h3>
                <div class="requirements-grid">
                    <div class="requirement-item">
                        <label>操作系统</label>
                        <div class="value">Windows 10/11 (64位)</div>
                    </div>
                    <div class="requirement-item">
                        <label>处理器</label>
                        <div class="value">Intel i5 / AMD Ryzen 5 或更高</div>
                    </div>
                    <div class="requirement-item">
                        <label>内存</label>
                        <div class="value">8 GB RAM (推荐 16 GB)</div>
                    </div>
                    <div class="requirement-item">
                        <label>存储空间</label>
                        <div class="value">至少 2 GB 可用空间</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 小智 AI 助手. All rights reserved.</p>
            <p style="margin-top: 10px;">如有问题，请联系技术支持</p>
        </div>
    </div>

    <script>
        let releaseInfo = null;

        function downloadVersion(version) {
            const platform = releaseInfo && releaseInfo.platforms
                ? Object.values(releaseInfo.platforms).find(p => p.artifacts && p.artifacts[version])
                : null;

            if (platform) {
                window.location.href = '/api/download/' + version;
            } else {
                alert('该版本暂未提供下载');
            }
        }

        function applyReleaseInfo(info) {
            releaseInfo = info;

            document.querySelectorAll('[data-release]').forEach(el => {
                const value = info[el.dataset.release];
                if (value) {
                    el.textContent = value;
                }
            });

            document.querySelectorAll('[data-release-arch]').forEach(el => {
                const key = el.dataset.releaseArch;
                const platform = Object.values(info.platforms || {})
                    .find(p => p.artifacts && p.artifacts[key]);
                if (platform && platform.arch) {
                    el.textContent = platform.arch;
                }
            });

            document.querySelectorAll('[data-release-filename]').forEach(el => {
                const key = el.dataset.releaseFilename;
                const platform = Object.values(info.platforms || {})
                    .find(p => p.artifacts && p.artifacts[key]);
                if (platform && platform.artifacts[key]) {
                    el.textContent = platform.artifacts[key].filename;
                }
            });

            document.querySelectorAll('[data-download-key]').forEach(el => {
                const key = el.dataset.downloadKey;
                el.onclick = () => downloadVersion(key);
            });
        }

        fetch('/api/release')
            .then(res => res.ok ? res.json() : Promise.reject(res.status))
            .then(applyReleaseInfo)
            .catch(err => console.warn('版本信息加载失败:', err));
    </script>
</body>
</html>
